name: 大意の誤り
description: 大意の誤りや、よりよい大意を知らせる
title: "[訳] 末吉安持 詩篇（『沖縄文学選 日本文学のエッジからの問い』より） "
labels: ["訳"]
body:
  - type: input
    id: block
    attributes:
      label: 段落ID
      description: "行頭にある ID（例: sueyoshi-anji-1f63652b-000001）"
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: いまの大意
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: 直した大意
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 理由・根拠
